plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.jarvis.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.mobile"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
