[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-rebuild"
version = "0.1.0"
description = "Modular reconstruction scaffold for a personal AI desktop assistant"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=3.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "edge-tts>=6.1",
    "SpeechRecognition>=3.10",
    "groq>=0.4",
    "pyaudio>=0.2.14; platform_system=='Windows'",
    "pyperclip>=1.8",
    "feedparser>=6.0",
    "psutil>=5.9",
    "imageio-ffmpeg>=0.5",
    "pydub>=0.25",
    "pygame>=2.5",
    "pyttsx3>=2.90",
    "chromadb>=0.5.0",
    "opencv-python>=4.8.0",
    "playwright>=1.40.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "onnxruntime>=1.26,<2",
    "kaldi-native-fbank>=1.22,<2",
]

[project.scripts]
jarvis-rebuild = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not live and not network and not hardware and not mobile_release'"
markers = [
    "unit: teste local, determinístico e sem efeitos externos",
    "integration: integra múltiplos componentes; execução explícita",
    "live: requer o Jarvis já iniciado e dados locais reais",
    "network: acessa rede externa",
    "hardware: acessa clipboard, mídia, microfone, registro ou hardware",
    "mobile_release: confere os assets Android; rodar com -m mobile_release só ao gerar o APK, depois de npm run build:mobile",
]
