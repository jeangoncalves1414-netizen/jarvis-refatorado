[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-rebuild"
version = "0.1.0"
description = "Modular reconstruction scaffold for a personal AI desktop assistant"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=3.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "edge-tts>=6.1",
    "SpeechRecognition>=3.10",
    "groq>=0.4",
    "pyaudio>=0.2.14; platform_system=='Windows'",
    "pyperclip>=1.8",
    "feedparser>=6.0",
    "psutil>=5.9",
    "imageio-ffmpeg>=0.5",
    "pydub>=0.25",
    "pygame>=2.5",
    "pyttsx3>=2.90",
    "chromadb>=0.5.0",
    "opencv-python>=4.8.0",
    "playwright>=1.40.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
]

[project.scripts]
jarvis-rebuild = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
