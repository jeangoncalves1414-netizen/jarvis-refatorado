<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Raphael Core - High Performance 60FPS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #020100;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #raphaelCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .interface-overlay {
      position: absolute;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .dialogue-box {
      text-align: center;
      margin-bottom: 14px;
      background: radial-gradient(circle, rgba(20, 10, 0, 0.8) 0%, rgba(0, 0, 0, 0) 80%);
      padding: 6px 30px;
    }

    .voice-tag {
      font-size: 11px;
      letter-spacing: 5px;
      color: #55ffd8;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 200, 0.7);
    }

    .status-text {
      margin-top: 4px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #ffe082;
      text-transform: uppercase;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      background: rgba(25, 12, 0, 0.7);
      border: 1px solid rgba(255, 180, 0, 0.45);
      color: #ffe599;
      padding: 10px 22px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    button:hover {
      background: rgba(255, 160, 0, 0.3);
      border-color: #ffd000;
      transform: translateY(-2px);
    }

    button.active {
      background: linear-gradient(135deg, #ffb300, #ff5500);
      color: #000;
      font-weight: 700;
      border-color: #fff2a8;
      box-shadow: 0 0 25px rgba(255, 150, 0, 0.8);
    }
  </style>
</head>
<body>

  <canvas id="raphaelCanvas"></canvas>

  <div class="interface-overlay">
    <div class="dialogue-box">
      <div class="voice-tag" id="voiceTag">« VOICE OF THE WORLD »</div>
      <div class="status-text" id="statusLabel">SISTEMA COGNITIVO OPERACIONAL</div>
    </div>

    <div class="controls">
      <button class="active" onclick="triggerAnswerSequence()">⚡ Disparar « 解 Answer »</button>
      <button onclick="setMode('thinking', this)">Analisando / Cálculo</button>
      <button onclick="setMode('speaking', this)">Raphael Explicando</button>
      <button id="micBtn" onclick="toggleMic()">🎙️ Usar Meu Microfone</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('raphaelCanvas');
    const ctx = canvas.getContext('2d');
    const statusLabel = document.getElementById('statusLabel');
    const voiceTag = document.getElementById('voiceTag');

    let width, height, center;
    let baseScale, maxDim;

    // Resolução equilibrada para 60 FPS lisos (evita sobrecarga em telas 4K)
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5); // Limita o DPR para não travar
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      center = { x: width / 2, y: height / 2 };
      maxDim = Math.max(width, height);
      baseScale = Math.min(width, height) * 0.95;
    }
    window.addEventListener('resize', resize);
    resize();

    let currentState = 'speaking';
    let targetEnergy = 0.3;
    let smoothEnergy = 0.3; // Interpolação suave (Lerp)
    let micStream = null, analyser = null, dataArray = null;

    let rOuter = 0, rInner = 0, raysAngle = 0;

    // --- OTIMIZAÇÃO: PRÉ-RENDERIZAR RUNAS NA MEMÓRIA UMA VEZ SÓ ---
    let offscreenOuterRing, offscreenInnerRing;

    function buildRuneRingTexture(radius, count, glyphScaleY) {
      const tex = document.createElement('canvas');
      const pad = 60;
      const texSize = (radius + pad) * 2;
      tex.width = texSize;
      tex.height = texSize;
      const tCtx = tex.getContext('2d');
      const tCenter = texSize / 2;

      tCtx.translate(tCenter, tCenter);

      // Linhas duplas de borda
      tCtx.strokeStyle = 'rgba(255, 220, 90, 0.85)';
      tCtx.lineWidth = 2.0;
      tCtx.beginPath();
      tCtx.arc(0, 0, radius + 22, 0, Math.PI * 2);
      tCtx.arc(0, 0, radius - 22, 0, Math.PI * 2);
      tCtx.stroke();

      tCtx.strokeStyle = 'rgba(255, 140, 0, 0.4)';
      tCtx.lineWidth = 1.0;
      tCtx.beginPath();
      tCtx.arc(0, 0, radius + 28, 0, Math.PI * 2);
      tCtx.arc(0, 0, radius - 28, 0, Math.PI * 2);
      tCtx.stroke();

      // Glifos
      const glyphs = ['᚛', '᚜', 'ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᛝ', 'ᛟ', 'Ψ', 'Ω', '§', '¶', 'Ξ', '1', '8', '0'];
      for (let i = 0; i < count; i++) {
        const a = (i * 2 * Math.PI) / count;
        tCtx.save();
        tCtx.rotate(a);
        tCtx.translate(0, -radius);
        tCtx.scale(0.85, glyphScaleY);

        tCtx.fillStyle = (i % 6 === 0) ? '#ffffff' : (i % 2 === 0 ? '#ffea8f' : '#ff9900');
        tCtx.font = 'bold 10px monospace';
        tCtx.textAlign = 'center';
        tCtx.textBaseline = 'middle';
        tCtx.fillText(glyphs[i % glyphs.length], 0, 0);

        if (i % 3 === 0) {
          tCtx.fillStyle = '#ffaa00';
          tCtx.fillRect(-0.8, -4, 1.6, 8);
        }
        tCtx.restore();
      }
      return tex;
    }

    function initRings() {
      offscreenOuterRing = buildRuneRingTexture(baseScale * 0.36, 88, 2.7);
      offscreenInnerRing = buildRuneRingTexture(baseScale * 0.235, 54, 2.4);
    }
    initRings();
    window.addEventListener('resize', initRings);

    // Múltiplos pacotes de dados fluindo continuamente nas trilhas
    const circuitStreams = Array.from({ length: 8 }, (_, i) => ({
      progress: i * 0.125,
      speed: 0.012 + Math.random() * 0.008,
      quadrant: i % 4
    }));

    // Partículas leves de poeira cósmica
    const particles = Array.from({ length: 30 }, () => ({
      x: (Math.random() - 0.5) * width,
      y: (Math.random() - 0.5) * height,
      size: Math.random() * 2 + 1,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: -Math.random() * 0.8 - 0.2,
      alpha: Math.random() * 0.6 + 0.2
    }));

    let answerAnim = { active: true, progress: 0 };

    function triggerAnswerSequence() {
      answerAnim.active = true;
      answerAnim.progress = 0;
      voiceTag.innerText = '« RAPHAEL: COMUNICAÇÃO »';
      statusLabel.innerText = 'RESPOSTA: TRANSPORTE MÁGICO POSSÍVEL A BAIXO CUSTO';
    }

    function setMode(newState, btn) {
      currentState = newState;
      document.querySelectorAll('.controls button').forEach(b => {
        if (b.id !== 'micBtn') b.classList.remove('active');
      });
      if (btn) btn.classList.add('active');

      const labels = {
        idle: { tag: '« SISTEMA »', text: 'INDIVÍDUO: MODO DE ESPERA' },
        thinking: { tag: '« RAPHAEL: CÁLCULO »', text: 'ANALISANDO PROBABILIDADES...' },
        speaking: { tag: '« RAPHAEL: RELATÓRIO »', text: 'TRANSMITINDO DADOS DE SUPRIMENTOS...' }
      };

      if (labels[newState]) {
        voiceTag.innerText = labels[newState].tag;
        statusLabel.innerText = labels[newState].text;
      }
    }

    async function toggleMic() {
      const micBtn = document.getElementById('micBtn');
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        analyser = null;
        micBtn.classList.remove('active');
        statusLabel.innerText = 'MICROFONE DESCONECTADO';
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        micBtn.classList.add('active');
        voiceTag.innerText = '« ENTRADA DE VOZ DETECTADA »';
        statusLabel.innerText = 'PROCESSANDO COMANDOS DE RIMURU...';
      } catch (err) {
        alert("Não foi possível acessar o microfone.");
      }
    }

    function animate() {
      // 1. Áudio com interpolação suave (Lerp) para nunca dar trancos
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        const sum = dataArray.reduce((acc, val) => acc + val, 0);
        targetEnergy = (sum / dataArray.length / 255) * 2.2;
      } else {
        const t = Date.now() * 0.003;
        if (currentState === 'speaking') {
          targetEnergy = 0.4 + Math.sin(t * 4.5) * 0.3;
        } else if (currentState === 'thinking') {
          targetEnergy = 0.22 + Math.sin(t * 8) * 0.15;
        } else {
          targetEnergy = 0.07 + Math.sin(t * 2) * 0.03;
        }
      }
      smoothEnergy += (targetEnergy - smoothEnergy) * 0.12; // Transição amortecida amanteigada

      // 2. Rotações
      const speed = currentState === 'thinking' ? 2.6 : currentState === 'speaking' ? 1.5 : 0.8;
      rOuter += 0.0022 * speed;
      rInner -= 0.0018 * speed;
      raysAngle += 0.0008 * speed;

      ctx.clearRect(0, 0, width, height);

      // Additive blending super rápido (GPU Puro)
      ctx.globalCompositeOperation = 'lighter';
      ctx.save();
      ctx.translate(center.x, center.y);

      // --- CAMADA 1: AURA E NÉVOA DOURADA (FLUIDA) ---
      const auraGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, maxDim * 0.5);
      auraGrad.addColorStop(0, `rgba(255, 170, 0, ${0.45 + smoothEnergy * 0.25})`);
      auraGrad.addColorStop(0.3, `rgba(200, 60, 0, ${0.2 + smoothEnergy * 0.15})`);
      auraGrad.addColorStop(0.65, 'rgba(60, 15, 0, 0.06)');
      auraGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, maxDim * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Halo sutil esmeralda/ciano periférico
      const cyanGrad = ctx.createRadialGradient(0, 0, baseScale * 0.2, 0, 0, maxDim * 0.45);
      cyanGrad.addColorStop(0, 'transparent');
      cyanGrad.addColorStop(0.6, 'rgba(0, 240, 160, 0.08)');
      cyanGrad.addColorStop(0.85, 'rgba(0, 180, 255, 0.05)');
      cyanGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = cyanGrad;
      ctx.beginPath();
      ctx.arc(0, 0, maxDim * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // --- CAMADA 2: RAIOS SOLARES RADIANTES COM ONDULAÇÃO VIVA ---
      ctx.save();
      ctx.rotate(raysAngle);
      const rayCount = 72;
      const rayMaxDist = maxDim * 0.75;
      const timeNow = Date.now() * 0.002;

      for (let i = 0; i < rayCount; i++) {
        const a = (i * 2 * Math.PI) / rayCount;
        ctx.save();
        ctx.rotate(a);

        // Ondulação individual por seno (faz os raios parecerem vivos)
        const wave = Math.sin(timeNow + i * 0.5) * 20;
        const isLong = i % 4 === 0;
        const len = (isLong ? rayMaxDist : rayMaxDist * 0.65) + wave + smoothEnergy * 50;

        const rayGrad = ctx.createLinearGradient(0, 0, 0, -len);
        rayGrad.addColorStop(0, 'rgba(255, 255, 220, 0.85)');
        rayGrad.addColorStop(0.2, 'rgba(255, 190, 40, 0.4)');
        rayGrad.addColorStop(0.6, 'rgba(255, 90, 0, 0.08)');
        rayGrad.addColorStop(1, 'transparent');

        ctx.strokeStyle = rayGrad;
        ctx.lineWidth = isLong ? 2.0 : 0.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();

      // --- CAMADA 3: DESENHO INSTANTÂNEO DOS ANÉIS PRÉ-RENDERIZADOS (0% LAG) ---
      ctx.save();
      ctx.rotate(rOuter);
      ctx.drawImage(offscreenOuterRing, -offscreenOuterRing.width / 2, -offscreenOuterRing.height / 2);
      ctx.restore();

      ctx.save();
      ctx.rotate(rInner);
      ctx.drawImage(offscreenInnerRing, -offscreenInnerRing.width / 2, -offscreenInnerRing.height / 2);
      ctx.restore();

      // --- CAMADA 4: O PROCESSADOR DOURADO (LOSANGO + CIRCUITOS VIVOS) ---
      const scaleProc = 1 + smoothEnergy * 0.12;
      ctx.save();
      ctx.scale(scaleProc, scaleProc);

      const dRadius = baseScale * 0.165;

      // Losango
      ctx.strokeStyle = '#fff0ba';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(0, -dRadius);
      ctx.lineTo(dRadius, 0);
      ctx.lineTo(0, dRadius);
      ctx.lineTo(-dRadius, 0);
      ctx.closePath();
      ctx.stroke();

      // Quadrado
      const sqSize = dRadius * 1.33;
      const sqHalf = sqSize / 2;
      ctx.strokeStyle = 'rgba(255, 210, 80, 0.8)';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(-sqHalf, -sqHalf, sqSize, sqSize);

      // Selos
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px serif';
      ctx.textAlign = 'center';
      ctx.fillText('☿', 0, -dRadius + 22);
      ctx.font = '8px monospace';
      ctx.fillText('↑  o  I', 0, -dRadius + 34);

      ctx.font = 'bold 13px serif';
      ctx.fillText('Ψ', 0, dRadius - 14);
      ctx.font = '8px monospace';
      ctx.fillText('[ H y p ]', 0, dRadius - 26);

      ctx.font = '8px monospace';
      ctx.fillText('C 1 0', -dRadius + 24, 4);
      ctx.fillText('1 1 ]', dRadius - 24, 4);

      // Trilhas de Silício / PCB
      const step = sqHalf / 4;
      ctx.strokeStyle = 'rgba(255, 220, 120, 0.7)';
      ctx.lineWidth = 1.4;

      for (let side = 0; side < 4; side++) {
        ctx.save();
        ctx.rotate((side * Math.PI) / 2);

        ctx.beginPath();
        ctx.moveTo(-sqHalf + 14, -sqHalf + 14);
        ctx.lineTo(-sqHalf + 36, -sqHalf + 36);
        ctx.lineTo(-step, -sqHalf + 36);
        ctx.lineTo(-step, -step - 8);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-sqHalf + 14, -sqHalf + 14, 2, 0, Math.PI * 2);
        ctx.arc(-step, -step - 8, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, -sqHalf + 8);
        ctx.lineTo(0, -step * 2);
        ctx.lineTo(step, -step);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(step, -step, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // PACOTES DE ENERGIA CORRENDO PELAS TRILHAS
      circuitStreams.forEach(stream => {
        stream.progress += stream.speed * (1 + smoothEnergy * 1.5);
        if (stream.progress > 1) stream.progress = 0;

        ctx.save();
        ctx.rotate((stream.quadrant * Math.PI) / 2);

        const px = (-sqHalf + 14) * (1 - stream.progress) + (-step) * stream.progress;
        const py = (-sqHalf + 14) * (1 - stream.progress) + (-step - 8) * stream.progress;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();

        // Rastro de luz
        ctx.fillStyle = 'rgba(255, 220, 80, 0.6)';
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // --- CAMADA 5: NÚCLEO SOLAR INCANDESCENTE + DUAL-CORE ENTRELAÇADO ---
      // Fornalha central de luz suave
      const coreLightR = baseScale * 0.14 * (1 + smoothEnergy * 0.4);
      const coreSun = ctx.createRadialGradient(0, 0, 0, 0, 0, coreLightR);
      coreSun.addColorStop(0, '#ffffff');
      coreSun.addColorStop(0.25, 'rgba(255, 245, 180, 0.95)');
      coreSun.addColorStop(0.55, 'rgba(255, 160, 0, 0.6)');
      coreSun.addColorStop(0.85, 'rgba(255, 80, 0, 0.15)');
      coreSun.addColorStop(1, 'transparent');
      ctx.fillStyle = coreSun;
      ctx.beginPath();
      ctx.arc(0, 0, coreLightR, 0, Math.PI * 2);
      ctx.fill();

      // Caixas do processador gêmeo com flutuação orgânica
      const coreBox = baseScale * 0.05 * (1 + smoothEnergy * 0.25);
      const offset = 7 + smoothEnergy * 4;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.4;
      ctx.strokeRect(-offset - coreBox / 2, -offset - coreBox / 2, coreBox, coreBox);
      ctx.strokeRect(offset - coreBox / 2, offset - coreBox / 2, coreBox, coreBox);

      // Lens flare anamórfico translúcido
      const flareWidth = width * 0.65 * (1 + smoothEnergy * 0.35);
      const flareHeight = 2.5 + smoothEnergy * 3;
      const flareGrad = ctx.createLinearGradient(-flareWidth, 0, flareWidth, 0);
      flareGrad.addColorStop(0, 'transparent');
      flareGrad.addColorStop(0.3, 'rgba(80, 240, 255, 0.12)');
      flareGrad.addColorStop(0.48, 'rgba(255, 235, 160, 0.6)');
      flareGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 + smoothEnergy * 0.15})`);
      flareGrad.addColorStop(0.52, 'rgba(255, 235, 160, 0.6)');
      flareGrad.addColorStop(0.7, 'rgba(80, 240, 255, 0.12)');
      flareGrad.addColorStop(1, 'transparent');

      ctx.fillStyle = flareGrad;
      ctx.fillRect(-flareWidth, -flareHeight / 2, flareWidth * 2, flareHeight);

      ctx.restore(); // Fecha o processador

      // --- CAMADA 6: POEIRA CÓSMICA EM MOVIMENTO ASCENDENTE ---
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.y < -height * 0.55) {
          p.y = height * 0.55;
          p.x = (Math.random() - 0.5) * width;
        }

        ctx.fillStyle = `rgba(255, 230, 150, ${p.alpha * (0.6 + smoothEnergy * 0.4)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // --- CAMADA 7: ABERTURA « 解 (ANSWER) » ---
      if (answerAnim.active) {
        answerAnim.progress += 0.018;

        let scale = 1, alpha = 1;
        if (answerAnim.progress < 0.6) {
          scale = 1.0 + answerAnim.progress * 0.08;
          alpha = 1.0;
        } else {
          const t = (answerAnim.progress - 0.6) / 0.4;
          scale = 1.05 + t * 2.5;
          alpha = Math.max(0, 1.0 - t * 1.5);
        }

        if (answerAnim.progress >= 1.0) answerAnim.active = false;

        ctx.save();
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;

        const discGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 125);
        discGrad.addColorStop(0, 'rgba(255, 255, 240, 0.98)');
        discGrad.addColorStop(0.4, 'rgba(255, 180, 0, 0.9)');
        discGrad.addColorStop(1, 'rgba(200, 50, 0, 0)');
        ctx.fillStyle = discGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 125, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 100px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('解', 0, -8);

        ctx.font = 'italic bold 24px serif';
        ctx.fillText('Answer.', 0, 52);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
