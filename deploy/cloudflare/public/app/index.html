<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101715">
<title>JARVIS</title>
<style>
  :root{color-scheme:dark;--bg:#101715;--panel:#19221d;--line:#35463b;--ink:#edf4ee;--muted:#aab9ad;--accent:#b7e5c4;--accent-ink:#16351f;--danger:#ffb4a9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#274433 0,var(--bg) 43%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}.shell{width:min(720px,100%);margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:#131b17e8;backdrop-filter:blur(10px);position:sticky;top:0;z-index:3}.mark{letter-spacing:.22em;font-weight:700;color:var(--accent)}.status{margin-left:auto;color:var(--muted);font-size:12px}.status::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#81d99d;margin-right:6px}.main{flex:1;display:flex;min-height:0;flex-direction:column}.history{padding:18px 15px 12px;overflow:auto;flex:1}.welcome{text-align:center;margin:16vh auto 0;max-width:390px;color:var(--muted)}.orb{width:76px;height:76px;border-radius:26px;display:grid;place-items:center;margin:auto auto 20px;background:linear-gradient(135deg,#b9e7c6,#4d865f);box-shadow:0 0 45px #72bd8570;color:#11311c;font-size:28px}.welcome h1{color:var(--ink);font-weight:500;letter-spacing:-.04em;margin:0 0 6px}.message{max-width:88%;margin:8px 0 16px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{margin-left:auto;padding:11px 14px;border-radius:17px 17px 4px 17px;background:#26332a;border:1px solid #405348}.message.assistant{padding:2px 4px}.tag{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.turn-actions{margin-top:7px}.quiet{font:inherit;font-size:13px;border:0;background:transparent;color:var(--accent);padding:5px 0;cursor:pointer}.composer-wrap{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#141c17;border-top:1px solid var(--line)}.composer{display:flex;align-items:flex-end;gap:8px;background:#202b24;border:1px solid #4a5b4f;border-radius:18px;padding:8px}.composer:focus-within{border-color:#9ec9a9}.composer textarea{flex:1;min-height:44px;max-height:125px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:10px 5px}.round{width:43px;height:43px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-ink);font-size:18px;cursor:pointer}.round:disabled{opacity:.5}.round.recording{background:var(--danger);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(.92)}}.nav{display:flex;border-top:1px solid var(--line);background:#151d18}.nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:11px 4px;cursor:pointer}.nav button.active{color:var(--accent);background:#203025}.drawer{position:fixed;inset:62px 0 0;z-index:4;background:#101715;padding:16px;overflow:auto}.drawer[hidden]{display:none}.drawer h2{margin:0 0 14px;font-size:21px}.session{width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:7px 0;padding:12px;font:inherit;cursor:pointer}.session small{display:block;color:var(--muted);margin-top:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.notice{position:fixed;z-index:8;left:16px;right:16px;bottom:88px;max-width:688px;margin:auto;background:#e8f5ea;color:#16351f;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px #0008}.notice.error{background:#ffdad4;color:#5d1a13}.notice[hidden]{display:none}.button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px system-ui;cursor:pointer}.muted{color:var(--muted)}
</style>
<body><div class="shell">
  <header class="top"><span class="mark">JARVIS</span><span class="status" id="status">Conectado</span></header>
  <main class="main"><div class="history" id="history"><section class="welcome" id="welcome"><div class="orb">✦</div><h1>Olá. Estou aqui.</h1><p>Seu Jarvis continua disponível mesmo com o PC desligado.</p></section></div>
    <div class="composer-wrap"><div class="composer"><button class="round" id="mic" aria-label="Falar">◉</button><textarea id="input" placeholder="Fale com o Jarvis" rows="1"></textarea><button class="round" id="send" aria-label="Enviar">↑</button></div></div>
  </main>
  <nav class="nav"><button class="active" data-view="chat">Chat</button><button data-view="sessions">Conversas</button><button data-view="routine">Rotina</button><button data-view="settings">Ajustes</button></nav>
</div><aside class="drawer" id="drawer" hidden></aside><div class="notice" id="notice" hidden></div>
<script>
(() => {
  'use strict';
  const q = s => document.querySelector(s), history = q('#history'), input = q('#input'), send = q('#send'), mic = q('#mic'), drawer = q('#drawer'), notice = q('#notice');
  let current = localStorage.getItem('jarvis-session') || crypto.randomUUID(), recorder, chunks = [], activeAudio;
  const tell = (message, bad=false) => { notice.textContent=message; notice.className='notice'+(bad?' error':'');notice.hidden=false; clearTimeout(tell.timer);tell.timer=setTimeout(()=>notice.hidden=true,5200); };
  const request = async (url, options={}) => { const res=await fetch(url,{credentials:'same-origin',...options}); if(!res.ok){let data={};try{data=await res.json()}catch{}throw Error(data.error||'Falha de conexão.')} return res; };
  const scroll=()=>history.scrollTo({top:history.scrollHeight,behavior:'smooth'});
  const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','>':'&gt;','<':'&lt;','"':'&quot;',"'":'&#39;'}[c]));
  function bubble(role,text,withSpeak=true){q('#welcome')?.remove(); const node=document.createElement('article');node.className='message '+role;node.innerHTML=(role==='assistant'?'<span class="tag">JARVIS</span>':'')+'<div>'+esc(text)+'</div>'; if(role==='assistant'&&withSpeak){const button=document.createElement('button');button.className='quiet';button.textContent='Ouvir voz do Jarvis';button.onclick=()=>speak(text);node.append(button)}history.append(node);scroll();return node}
  async function speak(text){try{activeAudio?.pause(); const res=await request('/api/voice/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});const blob=await res.blob();activeAudio=new Audio(URL.createObjectURL(blob));await activeAudio.play()}catch(e){tell(e.message,true)}}
  async function sendMessage(text=input.value.trim()) {if(!text)return; input.value='';input.style.height='';bubble('user',text);send.disabled=true;try{const res=await request('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,session_id:current,origin:'mobile'})});const data=await res.json();current=data.session_id;localStorage.setItem('jarvis-session',current);bubble('assistant',data.reply); }catch(e){bubble('assistant','Tive um problema para responder.');tell(e.message,true)}finally{send.disabled=false;input.focus()}}
  async function loadSession(id){try{const res=await request('/api/session?id='+encodeURIComponent(id));const data=await res.json();history.innerHTML='';(data.messages||[]).forEach(m=>bubble(m.role,m.content));current=id;localStorage.setItem('jarvis-session',id);closeDrawer()}catch(e){tell(e.message,true)}}
  function closeDrawer(){drawer.hidden=true;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='chat'))}
  async function openSessions(){drawer.hidden=false;drawer.innerHTML='<h2>Conversas</h2><button class="button" id="new">Nova conversa</button><p class="muted">Histórico protegido no seu painel.</p><div id="session-list"></div>';q('#new').onclick=()=>{current=crypto.randomUUID();localStorage.setItem('jarvis-session',current);history.innerHTML='<section class="welcome" id="welcome"><div class="orb">✦</div><h1>Nova conversa</h1><p>Como posso ajudar?</p></section>';closeDrawer()};try{const data=await (await request('/api/sessions')).json();const list=q('#session-list');(data.sessions||[]).forEach(s=>{const b=document.createElement('button');b.className='session';b.innerHTML=esc(s.title||'Nova conversa')+'<small>'+new Date(s.updated_at).toLocaleString('pt-BR')+'</small>';b.onclick=()=>loadSession(s.id);list.append(b)});if(!(data.sessions||[]).length)list.innerHTML='<p class="muted">Ainda não há conversas salvas.</p>'}catch(e){tell(e.message,true)}}
  function openRoutine(){if(window.JarvisMobile&&window.JarvisMobile.openRoutine){window.JarvisMobile.openRoutine();return;}drawer.hidden=false;drawer.innerHTML='<h2>Rotina e alarmes</h2><section class="card"><p>Os alarmes rodam no próprio celular para funcionarem sem PC e sem nuvem.</p><p class="muted">Abra a área Rotina no aplicativo Android para configurar seus horários.</p></section>'}
  function openSettings(){drawer.hidden=false;drawer.innerHTML='<h2>Ajustes</h2><section class="card"><strong>Privacidade mobile</strong><p>Este painel não usa reconhecimento facial nem verificação de voz.</p><p class="muted">A senha de abertura é opcional e será configurada no próprio app Android.</p></section><section class="card"><strong>Voz</strong><p>A leitura de respostas e o briefing do alarme usam a voz FishAudio configurada no Worker.</p></section>'}
  async function transcribe(blob){const res=await request('/api/voice/stt',{method:'POST',headers:{'content-type':blob.type||'audio/webm'},body:blob});const data=await res.json();if(data.text)await sendMessage(data.text);else tell('Não entendi o áudio. Tente novamente.',true)}
  async function toggleMic(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());mic.classList.remove('recording');mic.textContent='◉';try{await transcribe(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}))}catch(e){tell(e.message,true)}};recorder.start();mic.classList.add('recording');mic.textContent='■'}catch(e){tell('Permita o microfone para usar a chamada por voz.',true)}}
  send.onclick=()=>sendMessage();mic.onclick=toggleMic;input.addEventListener('input',()=>{input.style.height='';input.style.height=Math.min(input.scrollHeight,125)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{const view=button.dataset.view;if(view==='sessions')openSessions();else if(view==='routine')openRoutine();else if(view==='settings')openSettings();else closeDrawer()});
})();
</script>
</body></html>
