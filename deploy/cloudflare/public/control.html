<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · Celular</title><style>body{font:16px system-ui;background:#101115;color:#f4f4f5;max-width:680px;margin:0 auto;padding:28px}section{background:#1a1b22;padding:22px;border-radius:16px;margin:16px 0}input,button,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #444;background:#101115;color:#fff}button{background:#8447e8;border:0;cursor:pointer}small{color:#b8b8c0}#panel{display:none}.row{display:flex;gap:9px;flex-wrap:wrap}.device{border-top:1px solid #34343c;padding:14px 0}</style></head><body><h1>Jarvis · controle do celular</h1><section id="claim"><p>No celular, abra <b>Casa → Controle remoto</b>, ative o serviço e toque em <b>Gerar código do PC</b>. Digite o código abaixo.</p><div class="row"><input id="code" maxlength="6" inputmode="numeric" placeholder="Código de 6 dígitos"><button onclick="claim()">Conectar este PC</button></div><p id="claimStatus"></p></section><section id="panel"><p><small>Os comandos chegam apenas enquanto o serviço “Controle remoto do Jarvis” estiver ativo no celular.</small></p><div id="devices"></div></section><script>const $=id=>document.getElementById(id);async function claim(){const r=await fetch('/api/remote/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('code').value})});const d=await r.json();$('claimStatus').textContent=d.error||'Conectado.';if(r.ok)load()}async function command(id,command){const r=await fetch('/api/remote/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({target_id:id,command})});const d=await r.json();alert(d.error||'Comando enviado ao celular.')}async function load(){const r=await fetch('/api/remote/status');if(!r.ok)return;const d=await r.json();$('claim').style.display='none';$('panel').style.display='block';$('devices').innerHTML=(d.devices||[]).map(x=>`<div class="device"><b>${x.name}</b> — ${x.online?'online':'offline'}<div class="row"><button onclick="command('${x.id}','open_youtube')">YouTube</button><button onclick="command('${x.id}','open_chrome')">Chrome</button><button onclick="command('${x.id}','open_whatsapp')">WhatsApp</button><button onclick="command('${x.id}','open_settings')">Configurações</button><button onclick="command('${x.id}','home')">Início</button><button onclick="command('${x.id}','back')">Voltar</button><button onclick="command('${x.id}','recents')">Recentes</button><button onclick="command('${x.id}','notifications')">Notificações</button></div></div>`).join('')||'<p>Nenhum celular conectado.</p>'}load();setInterval(load,10000)</script></body></html>
